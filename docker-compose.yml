version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: ms-usuario-db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ms_usuario
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: ms-usuario-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://db:3306/ms_usuario?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: